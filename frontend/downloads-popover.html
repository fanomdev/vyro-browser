<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYRO Downloads</title>
<style>
  :root { --bg:#151d2e; --line:rgba(255,255,255,.10); --text:#f1f5f9; --muted:#94a3b8;
          --accent:#7c5cff; --cyan:#35d6e8; --font:"Inter","Segoe UI",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:var(--font); background:var(--bg); color:var(--text); }
  body { border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; overflow:hidden;
         transform-origin: top right; animation: popIn 260ms cubic-bezier(.16,1.3,.3,1) both; }
  @keyframes popIn { from { opacity:0; transform:scale(.86) translateY(-10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { body { animation:none; } }
  .head { display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
          border-bottom:1px solid var(--line); font-size:13px; font-weight:700; }
  .close { border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; }
  .close:hover { color:var(--text); }
  .items { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .item { padding:10px; border-radius:8px; background:rgba(255,255,255,.05); }
  .item.new { animation:itemIn 260ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes itemIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
  .name { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px;
          margin:4px 0 6px; font-variant-numeric:tabular-nums; }
  .bar { height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .bar.wait > span { width:30%; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { from{transform:translateX(-100%)} to{transform:translateX(340%)} }
  .acts { display:flex; justify-content:space-between; gap:8px; margin-top:6px; }
  .link { border:0; background:transparent; color:var(--cyan); font-size:11px; cursor:pointer; padding:2px 0; }
  .link:hover { text-decoration:underline; }
  .act { color:var(--accent); }
  .foot { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; border-top:1px solid var(--line); }
  .btn { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:7px;
         padding:7px 10px; font-size:11px; cursor:pointer; }
  .btn:hover { background:rgba(255,255,255,.08); }
  .empty { color:var(--muted); font-size:12px; padding:14px; }
</style>
</head>
<body>
  <div class="head"><span>Downloads</span><button class="close" id="close" title="Close">×</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <button class="btn" id="folder">Change location</button>
    <button class="btn" id="clear">Clear finished</button>
  </div>
<script>
  const T = window.__TAURI_INTERNALS__ || {};
  const invoke = (c, a={}) => T.invoke(c, a);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const bytes = n => { n=Number(n)||0; if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; if(n<1073741824)return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; };
  const seen = new Set();
  async function render(){
    try {
      const data = await invoke('downloads_list');
      const items = data.items || [];
      document.getElementById('items').innerHTML = items.map(d => {
        const st = typeof d.state === 'string' ? d.state : Object.keys(d.state)[0];
        const known = Number(d.total) > 0;
        const pct = known ? Math.min(100, Math.round(d.received/d.total*100)) : 0;
        const label = st==='InProgress' ? 'Downloading' : st==='Completed' ? 'Completed' : st==='Pending' ? 'Pending' : st==='Cancelled' ? 'Cancelled' : 'Failed';
        const size = known ? bytes(d.received)+' / '+bytes(d.total)+' · '+pct+'%' : bytes(d.received)+' · getting size…';
        const fresh = seen.has(d.id) ? '' : (seen.add(d.id), ' new');
        const canPause = st === 'InProgress' || st === 'Pending';
        const canResume = st === 'Paused';
        const toggle = (canPause || canResume)
          ? '<button class="link act" data-id="'+d.id+'" data-act="'+(canPause?'pause':'resume')+'">'+(canPause?'Pause':'Resume')+'</button>'
          : '';
        return '<div class="item'+fresh+'"><div class="name" title="'+esc(d.filename)+'">'+esc(d.filename)+'</div>'+
          '<div class="meta"><span>'+label+'</span><span>'+size+'</span></div>'+
          '<div class="bar '+(known?'':'wait')+'"><span style="width:'+(known?pct+'%':'30%')+'"></span></div>'+
          '<div class="acts">'+toggle+'<button class="link" data-path="'+esc(d.target_path)+'">Show in folder</button></div></div>';
      }).join('') || '<div class="empty">No downloads yet.</div>';
      document.querySelectorAll('.link[data-path]').forEach(b => b.onclick = () =>
        invoke('download_show_in_folder', { path: b.dataset.path }).catch(e => alert(e)));
      document.querySelectorAll('.act').forEach(b => b.onclick = async () => {
        const cmd = b.dataset.act === 'pause' ? 'download_pause' : 'download_resume';
        await invoke(cmd, { id: Number(b.dataset.id) }).catch(e => alert(e));
        render();
      });
    } catch(e) { document.getElementById('items').innerHTML = '<div class="empty">'+esc(e)+'</div>'; }
  }
  document.getElementById('close').onclick = () => invoke('download_popover', { show:false }).catch(()=>{});
  document.getElementById('clear').onclick = async () => { await invoke('downloads_clear'); render(); };
  document.getElementById('folder').onclick = async () => {
    await invoke('open_download_settings').catch(()=>{});
  };
  render();
  if (T.transformCallback) {
    invoke('plugin:event|listen', {
      event:'vyro://downloads', target:{kind:'Any'},
      handler: T.transformCallback(() => render())
    }).catch(()=>setInterval(render, 1000));
  } else setInterval(render, 1000);
</script>
</body>
</html>
