<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Tab — VYRO</title>
<style>
  :root { --accent:#7c5cff; --bg:#0b0f19; --surface:#151d2e; --line:rgba(255,255,255,.10);
          --text:#f1f5f9; --muted:#94a3b8; --font:"Inter","Segoe UI",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; font-family:var(--font); color:var(--text); background:var(--bg);
         display:flex; align-items:center; justify-content:center; }
  .wrap { width:min(620px,86vw); display:flex; flex-direction:column; align-items:center; }
  .mark { width:52px; height:52px; margin-bottom:20px; }
  .mark path { fill:var(--accent); }
  .mark .spark { fill:var(--text); }
  h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:.22em; line-height:1; }
  .tag { margin:10px 0 32px; color:var(--muted); font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
  form { width:100%; }
  input { width:100%; padding:14px 18px; border-radius:8px; border:1px solid var(--line);
          background:var(--surface); color:var(--text); font:inherit; font-size:14px; outline:none; }
  input::placeholder { color:#64748b; }
  input:focus { border-color:var(--accent); }
  .links { width:100%; display:flex; flex-direction:column; gap:6px; margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
  a { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px;
      color:var(--muted); background:var(--surface); text-decoration:none; font-size:13px;
      transition:background 150ms ease,color 150ms ease; }
  a:hover { background:#1b2436; color:var(--text); }
  a span { color:var(--faint); }
  footer { position:absolute; bottom:24px; color:#64748b; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
      <path d="M112 128 L196 128 L256 380 L176 380 Z"/>
      <path d="M316 128 L400 128 L336 380 L256 380 Z"/>
      <path class="spark" d="M256 74 L270 100 L256 126 L242 100 Z"/>
    </svg>
    <h1>VYRO</h1>
    <div class="tag">Browse Beyond Limits.</div>
    <form id="f"><input id="q" autocomplete="off" spellcheck="false" placeholder="Search privately or enter an address" autofocus /></form>
    <div class="links">
      <a href="https://duckduckgo.com">DuckDuckGo <span>↗</span></a>
      <a href="https://github.com">GitHub <span>↗</span></a>
      <a href="https://doc.rust-lang.org">Rust <span>↗</span></a>
      <a href="https://en.wikipedia.org">Wikipedia <span>↗</span></a>
    </div>
  </div>
  <footer>Privacy-first · Protection active</footer>
<script>
  const T = window.__TAURI_INTERNALS__ || {};
  const invoke = (c,a={}) => T.invoke ? T.invoke(c,a) : Promise.reject('no ipc');
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = document.getElementById('q');
    if (!q.value.trim()) return;
    try {
      const tabs = await invoke('list_tabs');
      const id = tabs.find(t => t.active)?.id ?? tabs[0]?.id;
      if (id) await invoke('navigate', { id, input: q.value });
    } catch (_) { location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q.value); }
  });
</script>
</body>
</html>
